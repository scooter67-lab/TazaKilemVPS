services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Образы собираются на самом сервере: с этого VPS недоступны ни ghcr.io, ни
    # github.com (DPI-фильтрация провайдера), а заводить аккаунт в реестре не нужно.
    # Исходники привозит раннер по ssh, дальше docker compose up -d --build.
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    # Наружу порт не публикуем: доступ только через caddy по https
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-magazine.tbgroup.kz}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Сертификат выпускает certbot на хосте через DNS-01 (см. Caddyfile).
      # Внутри live/ лежат симлинки в archive/ — монтируем каталог целиком.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"

volumes:
  pg_data:
  caddy_data:
  caddy_config:
