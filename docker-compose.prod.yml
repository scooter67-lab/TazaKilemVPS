services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    # Образ собирается в GitHub Actions и лежит в Docker Hub (ghcr.io с этого VPS
    # недоступен). DOCKERHUB_USER и IMAGE_TAG приходят из файла .env рядом с этим
    # compose — его пишет workflow при каждом деплое.
    # Локально можно собрать на месте: docker compose -f ... up -d --build
    image: ${DOCKERHUB_USER}/tazakilem-backend:${IMAGE_TAG:-latest}
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.production
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: ${DOCKERHUB_USER}/tazakilem-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      - backend
    # Наружу порт не публикуем: доступ только через caddy по https
    expose:
      - "80"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-magazine.tbgroup.kz}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"

volumes:
  pg_data:
  caddy_data:
  caddy_config:
