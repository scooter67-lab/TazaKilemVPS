name: Deploy to VPS

# Образы собираются на самом сервере, реестр не используется вовсе.
# Причина: с VPS (magazine.tbgroup.kz) провайдер режет github.com и ghcr.io на
# уровне DPI — TCP проходит, TLS ClientHello остаётся без ответа. Поэтому сервер
# не может ни сделать git pull, ни забрать образ из GHCR. Роль раннера сводится
# к доставке исходников по ssh: соединение идёт снаружи внутрь и фильтром не задето.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Сборка и деплой на VPS
    runs-on: ubuntu-latest
    env:
      APP_DIR: ${{ secrets.VPS_APP_DIR }}
      SSH_TARGET: ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}
      SSH_PORT: ${{ secrets.VPS_PORT }}
      SSH_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Настройка SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # Исходники едут одним потоком: tar на раннере -> tar на сервере.
      # backend/.env.production в архиве нет, поэтому секреты на сервере не затираются.
      - name: Доставка исходников
        run: |
          set -e
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_TARGET" "mkdir -p '$APP_DIR'"
          tar czf - \
            --exclude=node_modules --exclude=dist --exclude=__pycache__ \
            --exclude='*.db' --exclude='.env' --exclude='.env.production' \
            backend frontend caddy docker-compose.prod.yml \
            | ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -p "$SSH_PORT" "$SSH_TARGET" \
                "tar xzf - -C '$APP_DIR'"

      - name: Сборка и запуск на сервере
        run: |
          ssh -i ~/.ssh/id_deploy -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
              -p "$SSH_PORT" "$SSH_TARGET" bash -s <<REMOTE
          set -e
          cd "$APP_DIR"
          # Секреты не создаём автоматически: прод не должен подняться с шаблонными
          # SECRET_KEY и паролем БД.
          if [ ! -f backend/.env.production ]; then
            echo "ОШИБКА: backend/.env.production отсутствует на сервере (см. DEPLOY.md, шаг 3)."
            exit 1
          fi
          # Сборка идёт до пересоздания контейнеров: если она упадёт, работающий
          # стек останется на прежней версии.
          docker compose -f docker-compose.prod.yml build
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml ps
          # Слои предыдущих релизов иначе копятся до заполнения диска
          docker image prune -f
          REMOTE

      - name: Проверка, что сайт отвечает
        run: |
          for i in $(seq 1 12); do
            code=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' https://magazine.tbgroup.kz/api/health || echo 000)
            echo "попытка $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "деплой подтверждён"
              exit 0
            fi
            sleep 10
          done
          echo "ОШИБКА: /api/health не ответил 200 за 2 минуты"
          exit 1
